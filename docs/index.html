<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MotoX</title>
    <style>html,body{background:#9cc3e6;height:100%;margin:0;overflow:hidden}#app{position:fixed;inset:0}#hud{color:#fff;text-shadow:0 2px 6px #00000080;pointer-events:none;font:32px/1 Impact,Arial Black,sans-serif;position:fixed;bottom:18px;right:22px}#turn,#trackInfo{color:#fff;white-space:pre;pointer-events:none;background:#00000080;border-radius:4px;padding:6px 10px;font:14px/1.5 ui-monospace,Consolas,monospace;position:fixed;bottom:18px;left:18px}#trackInfo{top:18px;bottom:auto}#turn[hidden],#trackInfo[hidden]{display:none}#airtime{color:#fff;text-shadow:0 3px 10px #00000080;pointer-events:none;font:56px/1 Impact,Arial Black,sans-serif;position:fixed;top:12%;left:50%;transform:translate(-50%)}#airtime[hidden]{display:none}#airtime.landed{color:#ffc21a}#view{color:#fff;pointer-events:none;background:#00000080;border-radius:4px;padding:4px 12px;font:600 15px/1.4 system-ui,sans-serif;position:fixed;top:18px;left:50%;transform:translate(-50%)}#view[hidden]{display:none}#help{color:#fff;pointer-events:none;white-space:nowrap;background:#0c0e129e;border-radius:10px;padding:16px 24px 14px;font:15px/1.4 system-ui,sans-serif;position:fixed;top:8%;left:50%;transform:translate(-50%)}#help h1{letter-spacing:.14em;text-align:center;margin:0 0 12px;font-size:24px}#help h1 span{color:#ff7a1a}#help dl{grid-template-columns:auto auto;align-items:center;gap:7px 14px;margin:0;display:grid}#help dt{text-align:right}#help dd{opacity:.9;margin:0}#help kbd{text-align:center;background:#ffffff24;border:1px solid #ffffff59;border-bottom-width:3px;border-radius:5px;min-width:1.5em;padding:1px 7px;font:700 13px/1.5 ui-monospace,Consolas,monospace;display:inline-block}</style>
    <script type="module" crossorigin src="./assets/index-CMekGWUE.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CBPHBila.css">
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="turn" hidden></div>
    <div id="trackInfo" hidden></div>
    <div id="airtime" hidden></div>
    <div id="view" hidden></div>
    <div id="help">
      <h1>MOTO<span>X</span></h1>
      <dl>
        <dt><kbd>W</kbd> <kbd>S</kbd></dt>
        <dd>go, brake (hold S when stopped to back up)</dd>
        <dt><kbd>A</kbd> <kbd>D</kbd></dt>
        <dd>turn</dd>
        <dt><kbd>Space</kbd></dt>
        <dd>powerslide: hold it while you steer</dd>
        <dt><kbd>↓</kbd> <kbd>↑</kbd></dt>
        <dd>lean back, forward (↓ with W: wheelie)</dd>
        <dt><kbd>C</kbd></dt>
        <dd>camera: close, chase, high, helmet, free roam</dd>
        <dt><kbd>R</kbd></dt>
        <dd>back to the start</dd>
        <dt><kbd>`</kbd></dt>
        <dd>debug menu</dd>
      </dl>
    </div>
  </body>
</html>
