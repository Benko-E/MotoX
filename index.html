<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MotoX</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #9cc3e6;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #hud {
        position: fixed;
        bottom: 18px;
        right: 22px;
        font: 32px/1 Impact, 'Arial Black', sans-serif;
        color: #fff;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
        pointer-events: none;
      }
      #turn {
        position: fixed;
        bottom: 18px;
        left: 18px;
        padding: 6px 10px;
        font: 14px/1.5 ui-monospace, Consolas, monospace;
        color: #fff;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 4px;
        white-space: pre;
        pointer-events: none;
      }
      #turn[hidden] {
        display: none;
      }
      #airtime {
        position: fixed;
        top: 12%;
        left: 50%;
        transform: translateX(-50%);
        font: 56px/1 Impact, 'Arial Black', sans-serif;
        color: #fff;
        text-shadow: 0 3px 10px rgba(0, 0, 0, 0.5);
        pointer-events: none;
      }
      #airtime[hidden] {
        display: none;
      }
      /* frozen on the last jump's time once landed */
      #airtime.landed {
        color: #ffc21a;
      }
      #view {
        position: fixed;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        padding: 4px 12px;
        font: 600 15px/1.4 system-ui, sans-serif;
        color: #fff;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 4px;
        pointer-events: none;
      }
      #view[hidden] {
        display: none;
      }
      #help {
        position: fixed;
        top: 8%;
        left: 50%;
        transform: translateX(-50%);
        padding: 16px 24px 14px;
        font: 15px/1.4 system-ui, sans-serif;
        color: #fff;
        background: rgba(12, 14, 18, 0.62);
        border-radius: 10px;
        pointer-events: none;
        white-space: nowrap;
      }
      #help h1 {
        margin: 0 0 12px;
        font-size: 24px;
        letter-spacing: 0.14em;
        text-align: center;
      }
      #help h1 span {
        color: #ff7a1a;
      }
      #help dl {
        display: grid;
        grid-template-columns: auto auto;
        gap: 7px 14px;
        margin: 0;
        align-items: center;
      }
      #help dt {
        text-align: right;
      }
      #help dd {
        margin: 0;
        opacity: 0.9;
      }
      #help kbd {
        display: inline-block;
        min-width: 1.5em;
        padding: 1px 7px;
        font: bold 13px/1.5 ui-monospace, Consolas, monospace;
        text-align: center;
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-bottom-width: 3px;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="turn" hidden></div>
    <div id="airtime" hidden></div>
    <div id="view" hidden></div>
    <div id="help">
      <h1>MOTO<span>X</span></h1>
      <dl>
        <dt><kbd>W</kbd> <kbd>S</kbd></dt>
        <dd>go, brake (hold S when stopped to back up)</dd>
        <dt><kbd>A</kbd> <kbd>D</kbd></dt>
        <dd>turn</dd>
        <dt><kbd>Space</kbd></dt>
        <dd>powerslide: hold it while you steer</dd>
        <dt><kbd>↓</kbd> <kbd>↑</kbd></dt>
        <dd>lean back, forward (↓ with W: wheelie)</dd>
        <dt><kbd>C</kbd></dt>
        <dd>camera: close, chase, high, helmet, free roam</dd>
        <dt><kbd>R</kbd></dt>
        <dd>back to the start</dd>
        <dt><kbd>`</kbd></dt>
        <dd>debug menu</dd>
      </dl>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
