<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MotoX</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #9cc3e6;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #hud {
        position: fixed;
        top: 10px;
        left: 10px;
        padding: 6px 10px;
        font: 12px/1.5 ui-monospace, Consolas, monospace;
        color: #fff;
        background: rgba(0, 0, 0, 0.45);
        border-radius: 4px;
        white-space: pre;
        pointer-events: none;
      }
      #banner {
        position: fixed;
        top: 28%;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 22px;
        font: bold 26px/1.4 system-ui, sans-serif;
        color: #fff;
        text-align: center;
        background: rgba(170, 30, 20, 0.75);
        border-radius: 8px;
        pointer-events: none;
        display: none;
      }
      #banner small {
        display: block;
        font-size: 15px;
        font-weight: normal;
      }
      #landing {
        position: fixed;
        top: 22%;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 16px;
        font: bold 18px/1.3 system-ui, sans-serif;
        letter-spacing: 0.06em;
        color: #fff;
        text-align: center;
        background: rgba(200, 120, 20, 0.8);
        border-radius: 6px;
        pointer-events: none;
        display: none;
      }
      #landing small {
        display: block;
        font-size: 13px;
        font-weight: normal;
        letter-spacing: 0;
      }
      /* The HUD: sizes in em are HUD units (1% of the screen height times hud.size). */
      .hud-layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
        font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', 'Arial Black', sans-serif;
        color: #fff;
      }
      .hud-slot {
        position: absolute;
      }
      .hud-speed-dial {
        display: block;
        width: 26em;
        height: 19.5em;
        filter: drop-shadow(0 0.3em 0.5em rgba(0, 0, 0, 0.45));
      }
      .hud-speed-housing {
        fill: #2e2219;
        stroke: #6e5a47;
        stroke-width: 3;
      }
      .hud-speed-tick {
        stroke: #e9e3d6;
        stroke-width: 1.6;
        stroke-linecap: round;
      }
      .hud-speed-tick.major {
        stroke-width: 3;
      }
      .hud-speed-number {
        fill: #ece6da;
        font-family: 'Arial Rounded MT Bold', 'Trebuchet MS', Arial, sans-serif;
        font-weight: bold;
        font-size: 13px;
        text-anchor: middle;
      }
      .hud-speed-unit {
        fill: #b9ae9c;
        font-family: 'Trebuchet MS', Arial, sans-serif;
        font-size: 9px;
        text-anchor: middle;
      }
      .hud-speed-needle {
        fill: #e0241b;
      }
      /* not .hud-letters: that's the name of the slot the row sits in */
      .hud-letter-row {
        display: flex;
        gap: 0.35em;
        font-size: 5em;
        line-height: 1;
      }
      .hud-letter {
        color: rgba(160, 160, 160, 0.5);
        -webkit-text-stroke: 0.03em rgba(0, 0, 0, 0.55);
      }
      .hud-letter.lit {
        color: #ffc21a;
        -webkit-text-stroke: 0.03em #6b4a00;
        text-shadow: 0 0 0.25em rgba(255, 190, 40, 0.55);
      }
      .hud-speed-hub {
        fill: #1b130d;
        stroke: #5a4a3a;
        stroke-width: 2;
      }
      #help {
        position: fixed;
        top: 7%;
        left: 50%;
        transform: translateX(-50%);
        padding: 16px 24px 14px;
        font: 15px/1.4 system-ui, sans-serif;
        color: #fff;
        background: rgba(12, 14, 18, 0.62);
        border-radius: 10px;
        pointer-events: none;
        white-space: nowrap;
      }
      #help h1 {
        margin: 0 0 12px;
        font-size: 24px;
        letter-spacing: 0.14em;
        text-align: center;
      }
      #help h1 span {
        color: #ff7a1a;
      }
      #help dl {
        display: grid;
        grid-template-columns: auto auto;
        gap: 7px 14px;
        margin: 0;
        align-items: center;
      }
      #help dt {
        text-align: right;
      }
      #help dd {
        margin: 0;
        opacity: 0.9;
      }
      #help kbd {
        display: inline-block;
        min-width: 1.5em;
        padding: 1px 7px;
        font: bold 13px/1.5 ui-monospace, Consolas, monospace;
        text-align: center;
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-bottom-width: 3px;
        border-radius: 5px;
      }
      #help p {
        margin: 12px 0 0;
        font-size: 13px;
        text-align: center;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud" hidden></div>
    <div id="banner"></div>
    <div id="landing"></div>
    <div id="help">
      <h1>MOTO<span>X</span></h1>
      <dl>
        <dt><kbd>W</kbd> <kbd>S</kbd></dt>
        <dd>throttle, brake</dd>
        <dt><kbd>A</kbd> <kbd>D</kbd></dt>
        <dd>steer</dd>
        <dt><kbd>Space</kbd></dt>
        <dd>powerslide: hold it while you steer</dd>
        <dt><kbd>↑</kbd> <kbd>↓</kbd></dt>
        <dd>lean forward, back: wheelies, stoppies, flips in the air</dd>
        <dt><kbd>R</kbd></dt>
        <dd>back on the bike</dd>
        <dt><kbd>C</kbd></dt>
        <dd>camera views (scroll wheel: zoom)</dd>
        <dt><kbd>`</kbd></dt>
        <dd>settings</dd>
      </dl>
      <p>Twist the throttle (W) to ride</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
