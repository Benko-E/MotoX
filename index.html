<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moto</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #9cc3e6;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #hud {
        position: fixed;
        top: 10px;
        left: 10px;
        padding: 6px 10px;
        font: 12px/1.5 ui-monospace, Consolas, monospace;
        color: #fff;
        background: rgba(0, 0, 0, 0.45);
        border-radius: 4px;
        white-space: pre;
        pointer-events: none;
      }
      #banner {
        position: fixed;
        top: 28%;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 22px;
        font: bold 26px/1.4 system-ui, sans-serif;
        color: #fff;
        text-align: center;
        background: rgba(170, 30, 20, 0.75);
        border-radius: 8px;
        pointer-events: none;
        display: none;
      }
      #banner small {
        display: block;
        font-size: 15px;
        font-weight: normal;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="banner"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
